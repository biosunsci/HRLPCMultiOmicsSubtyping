[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gcpytools"
version = "0.1.0"
description = "Minimal file-I/O helpers (importing/exporting tables, figures, excel) used by the analysis notebooks"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
dependencies = ["pandas", "numpy"]

[project.optional-dependencies]
full = ["openpyxl", "xlsxwriter", "matplotlib", "matplotlib-venn", "plotly", "dill", "ipython"]

[tool.setuptools]
py-modules = ["dblibs", "log_system"]
